name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]          # 推送版本标签时也触发
  pull_request:
    branches: [ main ]
  workflow_dispatch:         # 支持手动触发

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew :app:android:assembleDebug

      - name: Build Release APK
        run: ./gradlew :app:android:assembleRelease
        # 若 Release 需要签名，请参考下方“签名配置”说明

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-market-apks
          # 根据实际输出路径调整，以下为通用路径
          path: |
            app/android/build/outputs/apk/**/*.apk
            **/build/outputs/apk/**/*.apk
